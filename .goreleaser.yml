version: 2

project_name: thin

before:
  hooks:
    - go mod tidy

builds:
  - id: thin
    main: ./cmd/thin
    binary: thin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: thin
    ids:
      - thin
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - LICENSE-NOTES.md
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: thin
    ids:
      - thin
    repository:
      owner: monksvaughan
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/monksvaughan/thin
    description: Low-latency HTTP proxy for reducing input-token usage in AI coding workflows
    license: FSL-1.1-ALv2
    binaries:
      - thin
